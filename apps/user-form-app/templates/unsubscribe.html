<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Music Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .banner-message {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 5px;
            color: #155724;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .unsubscribe-box {
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            padding: 25px;
            border-radius: 5px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #b52a37;
        }
    </style>
</head>
<body>

    {% if banner_message %}
    <div class="banner-message">
        {{ banner_message }}
    </div>
    {% endif %}

    <div class="unsubscribe-box">
        <h2>Are you sure you want to unsubscribe?</h2>
        <p>You will stop receiving weekly music recommendations.</p>

        <form method="POST" action="/unsubscribe/confirm">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <button type="submit" class="btn btn-danger">Yes, unsubscribe me</button>
        </form>

        <br>
        <a href="/" class="btn">Cancel</a>
    </div>

</body>
</html>
