<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Received - BlurryBlu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
        }
        .success-message {
            background-color: #e6f7ff;
            border: 1px solid #b3e0ff;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .emoji {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .success-text {
            color: #0066cc;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .subtext {
            color: #666;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="success-message">
        <h2>Thanks for your feedback!</h2>
        <div class="success-text">
            Your vote helps us improve your recommendations
        </div>
        <div class="subtext">
            We'll use this to better understand your music taste and show you more of what you love.
        </div>
    </div>
    
    <a href="https://blurryblus.app" class="btn">Back to BlurryBlu</a>
</body>
</html>
