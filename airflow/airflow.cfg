[core]
airflow_home = /home/nathan.carter/airflow
dags_folder = /home/nathan.carter/airflow/dags
hostname_callable = socket.getfqdn
default_timezone = utc
executor = CeleryExecutor
load_examples = False
load_default_connections = False
store_serialized_dags = True
min_serialized_dag_update_interval = 30

[database]
sql_alchemy_conn = ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}

[celery]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/0
worker_prefetch_multiplier = 1

[webserver]
base_url = http://localhost:8081
web_server_host = 0.0.0.0
web_server_port = 8081
web_server_ssl_cert =
web_server_ssl_key =
web_server_master_timeout = 120
web_server_worker_timeout = 120
secret_key = ${AIRFLOW__WEBSERVER__SECRET_KEY}

[scheduler]
kill_orphaned_tasks = True
dag_dir_list_interval = 300

[logging]
base_log_folder = /home/nathan.carter/airflow/logs
remote_logging = False
